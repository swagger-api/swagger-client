schema_version: "1.1"
name: oas-3-3-upstream-gate
expected_outcome: |
  The run checks for the ApiDOM OpenAPI 3.3 namespace and apidom-reference openapi-3-3 strategies,
  finds them missing, stops without touching src or test, and routes the missing pieces to
  /add-spec-version in swagger-api/apidom. It finds that OpenAPI 3.3.0 itself is unreleased (only
  the v3.3-dev branch) and invents no 3.3 facts.
